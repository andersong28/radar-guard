name: Gerar APK

# Roda a cada push na main e tambem sob demanda pelo botao "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      # Sem gradle-wrapper.jar no repositorio: a action baixa o Gradle.
      # Assim o repo fica 100% texto e nao ha binario pra revisar ou corromper.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RadarGuard.apk
          ls -la out/

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RadarGuard-APK
          path: out/RadarGuard.apk
          retention-days: 90
